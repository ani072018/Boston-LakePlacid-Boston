  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');
  html, body { overflow-x:hidden; max-width:100vw; }
  img { max-width:100%; }
  :root{
    --ridge-black:#14181c;
    --dusk-slate:#1e262b;
    --panel:#242e33;
    --parchment:#efe6d3;
    --parchment-dim:#c9c0ab;
    --gold:#c9932e;
    --ember:#a83f22;
    --forest:#3a5745;
    --hairline: rgba(239,230,211,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--ridge-black);color:var(--parchment);font-family:'Inter',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased; overflow-x:hidden;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important;}}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;margin:0;}
  a{color:var(--gold);text-decoration:none;} a:hover{text-decoration:underline;}
  ::selection{background:var(--ember); color:var(--parchment);}
  .spine{position:fixed;left:0; top:0; bottom:0;width:56px;display:flex; align-items:center; justify-content:center;z-index:50;pointer-events:none;}
  .spine svg{ height:88vh; width:40px; }
  .spine-fill{stroke:var(--gold);stroke-width:3;fill:none;stroke-dasharray:1200;stroke-dashoffset:1200;transition:stroke-dashoffset 0.1s linear;filter:drop-shadow(0 0 4px rgba(201,147,46,0.6));}
  .spine-track{stroke:rgba(239,230,211,0.15);stroke-width:2;fill:none;}
  .spine-dot{fill:var(--ridge-black);stroke:var(--parchment-dim);stroke-width:1.5;transition:fill 0.3s ease, stroke 0.3s ease;}
  .spine-dot.lit{fill:var(--gold);stroke:var(--gold);}
  @media (max-width:820px){.spine{display:none;}}
  .wrap{max-width:760px;width:100%;margin:0 auto;padding:0 28px 120px 28px;position:relative; box-sizing:border-box;}
  @media (min-width:821px){.wrap{padding-left:96px; max-width:760px;}}
  .note{display:none;} .note-left{display:none;}
  @media (min-width:1240px){
    .checkpoint{position:relative;}
    .note{display:block;position:absolute;left:calc(100% + 40px);top:6px;width:190px;font-family:'Inter',sans-serif;}
    .note .note-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
    .note .note-label::before{content:'';width:14px; height:1px;background:var(--gold);display:inline-block;}
    .note .note-body{font-size:12.5px;line-height:1.65;color:var(--parchment-dim);font-style:italic;}
    .note-left{display:flex;flex-direction:column;align-items:flex-end;position:absolute;right:calc(100% + 40px);top:10px;width:150px;text-align:right;}
    .note-left .nl-fig{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;color:var(--parchment);line-height:1;}
    .note-left .nl-cap{font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--parchment-dim);margin-top:6px;opacity:0.75;}
  }
  .breadcrumb{font-size:12px;letter-spacing:0.06em;color:var(--parchment-dim);margin:22px 0 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .breadcrumb a{color:var(--parchment-dim);} .breadcrumb a:hover{color:var(--gold);} .breadcrumb span.sep{opacity:0.4;}
  .toc{background:var(--panel);border:1px solid var(--hairline);padding:20px 24px;margin:32px 0;border-radius:2px;}
  .toc-title{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--parchment);margin-bottom:12px;}
  .toc ol{margin:0;padding-left:18px;color:var(--parchment-dim);font-size:13.5px;line-height:2;}
  .toc ol a{color:var(--parchment-dim);} .toc ol a:hover{color:var(--gold);}
  .share-bar{display:flex;gap:10px;margin:28px 0 10px 0;flex-wrap:wrap; max-width:100%;}
  .share-bar a{border:1px solid var(--hairline);background:transparent;padding:10px 14px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--parchment-dim);border-radius:2px;transition:all .2s;}
  .share-bar a:hover{border-color:var(--gold);color:var(--gold);text-decoration:none;}
  .hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;position:relative;padding-top:30px;border-bottom:1px solid var(--hairline);overflow:hidden; max-width:100vw; box-sizing:border-box;}
  .hero-ridge{position:absolute;bottom:-2px; left:0; right:0;height:38vh;opacity:0.9; max-width:100%;}
  .topo{position:absolute;top:0; right:-8%;width:60%;height:100%;opacity:0.14;pointer-events:none; max-width:60%;}
  @media (max-width:820px){ .topo{display:none;} }
  .eyebrow{font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:10px;}
  .eyebrow::before{content:'';width:24px; height:1px;background:var(--gold);display:inline-block;}
  .hero h1{font-size:clamp(2.4rem, 7vw, 4.6rem);line-height:1.02;color:var(--parchment);max-width:15ch;}
  .hero h1 em{font-style:italic;color:var(--ember);background:linear-gradient(120deg, var(--gold), var(--ember));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero .sub{margin-top:26px;font-size:1.05rem;color:var(--parchment-dim);max-width:46ch;line-height:1.6;}
  .hero .meta{margin-top:44px;display:flex;gap:28px;flex-wrap:wrap;font-size:13px;color:var(--parchment-dim);}
  .hero .meta strong{display:block;color:var(--parchment);font-family:'Fraunces',serif;font-size:15px;font-weight:500;}
  .checkpoint{padding:100px 0 20px 0;border-bottom:1px solid var(--hairline); max-width:100%; box-sizing:border-box; overflow:hidden;}
  .checkpoint:last-of-type{border-bottom:none;}
  .cp-label{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .cp-mile{font-family:'Fraunces',serif;font-size:13px;color:var(--gold);letter-spacing:0.08em;white-space:nowrap;}
  .cp-time{font-size:12px;color:var(--parchment-dim);letter-spacing:0.06em;}
  .checkpoint h2{font-size:clamp(1.5rem, 4vw, 2.1rem);color:var(--parchment);margin-bottom:20px;max-width:26ch;}
  .checkpoint p{font-size:1.02rem;line-height:1.85;color:var(--parchment-dim);margin:0 0 18px 0;}
  .pull{font-family:'Fraunces',serif;font-style:italic;font-size:1.3rem;color:var(--gold);line-height:1.5;margin:30px 0;padding-left:22px;border-left:2px solid var(--ember);}
  .summit{margin:50px 0 10px 0;padding:36px 30px;background:linear-gradient(160deg, var(--forest) 0%, var(--panel) 100%);border-radius:2px;position:relative;overflow:hidden; max-width:100%; box-sizing:border-box;}
  .summit::after{content:'';position:absolute;top:0; right:0;width:220px; height:220px;background:radial-gradient(circle, rgba(201,147,46,0.25), transparent 70%);}
  .summit .cp-mile{color:var(--parchment);} .summit h2{color:var(--parchment);} .summit p{color:var(--parchment);}
  .stats-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:20px;margin:36px 0 0 0;padding:26px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .stats-row .stat{display:flex;flex-direction:column;gap:6px;}
  .stats-row .stat strong{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:600;color:var(--gold);}
  .stats-row .stat span{font-size:12px;color:var(--parchment-dim);line-height:1.4;}
  @media (max-width:900px){.stats-row{grid-template-columns:1fr 1fr; gap:18px;}}
  @media (max-width:520px){.stats-row{grid-template-columns:1fr; gap:14px;}}
  .photo-set{display:grid;gap:14px;margin:28px 0 8px 0; max-width:100%;}
  .photo-set.two{grid-template-columns:1fr 1fr; max-width:100%;}
  .photo-set.three{grid-template-columns:1.4fr 1fr; grid-template-rows:1fr 1fr; max-width:100%;}
  .photo-set.three img:first-child{grid-row:1 / 3;}
  .photo-set img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;filter:saturate(1.05) contrast(1.03);border:1px solid var(--hairline); max-width:100%;}
